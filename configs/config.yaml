# ---------------------------------------------------------------- Paths
raw_data_path: './data/raw/'
meta_data_path: './data/raw/meta_data.csv'
processed_data_path: './data/processed/'
log_dir: 'tb_logs'
video_dir: 'video'

# Pretrained JEPA encoder: the .ckpt written by jepa_training_multi_game.
# Used by encoder_check, the action classifier and the rollout world model.
jepa_checkpoint: 'tb_logs/multi_game/vjepa_world_model/version_0/checkpoints/CHANGE_ME.ckpt'
# The classifier saves into its run folder under tb_logs; the gym eval loads this file.
action_classifier_checkpoint: 'tb_logs/breakout/action_jepa_classifier/version_2/checkpoints/breakout-action-jepa-best.ckpt'
action_classifier_cnn_checkpoint: 'checkpoints/action_classifier/ms_pacman-action-classifier-best-curent-test-v1.ckpt' # CNN gym recording

# ----------------------------------------------------------------- Data
games: ['freeway']
num_actions: 18 # full ALE action space, shared across all games
train_sub: ['R', 'J']
val_sub: ['J'] # held out of train for the action classifier (picks the best checkpoint)
test_sub: ['K']
batch_size: 32
num_workers: 4 # measured loader throughput: 4 workers ~15 batches/s vs ~5 with 12 (12 train shards / 4 = 3 each)
shuffle: True # shuffle training samples (buffered; val/test keep their order)
shuffle_buffer: 5000 # samples held in the shuffle buffer, per loader worker

# Frames
original_size: [210, 160]
size_x: 84
size_y: 84
grey_scale: True # grayscale frames (1 channel each) everywhere: data, JEPA, classifier, gym
stack_length: 4 # frames per sample. Keep 4 for pretraining; the rollout world model builds its own
context_frames: &context_frames 4 # frames per JEPA window

# Gaze preprocessing
sigma: 5
eye_density: True
use_fixations: True
maxdist: 25
sampling_rate: 1000

data_writer:
  shard_write: False
  shard_maxcount: 6250
  data_write_freq: 3

# ----------------------------------------------------------------- JEPA
patchx: 21
patchy: 21
tubelet_size: *context_frames # frames per tubelet
epochs: 20 # shared by every training block

# ------------------------------------------------- Action classifier
freeze_encoder: true
learning_rate: 1e-4
encoder_lr: 1e-5 # only used when freeze_encoder is false
grad_clip: 1.0
class_weight_min_count: 100 # a class with fewer samples is weighted as if it had this many
class_weight_max_ratio: null # null = pure inverse frequency; a number caps the largest weight at that multiple of the smallest

# ------------------------------------------------- Conv JEPA
conv_jepa_dim: 512 # latent size of the CNN encoder
conv_jepa_frames: 2 # frames fed to the encoder (also the classifier's and gym's stack)
conv_jepa_horizon: 2 # next frames whose latent is predicted (= number of actions conditioned on)

# -------------------------------------- Rollout world model (optional)
ac_num_steps: 8 # future steps per sample; also the predictor's max sequence length
ac_auto_steps: 2 # steps of the auto-regressive rollout loss
ac_val_horizon: 8 # rollout length used for validation (<= ac_num_steps)
ac_dim: 512
ac_depth: 6
ac_heads: 8
ac_lr: 1e-4

# ------------------------------------------------------- Gym evaluation
gym_eval_episodes: 10
gym_max_steps: 10000
gym_record_video: true
gym_repeat_action_probability: 0.25 # sticky actions: chance a step repeats the last action (gym v5 default)
gym_auto_fire: true # press FIRE at episode start and after each life lost (Breakout needs it to launch the ball)
